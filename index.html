<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0d0f">
  <title>Gaveta Mental</title>

  <!-- Meta Tags para o Apple (Obrigatórias para PWA) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gaveta">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  
  <style>
    :root {
      --bg-color: #0d0d0f;
      --card-bg: #1a1a1e;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --accent-glow: rgba(139, 126, 248, 0.25);
      --border-light: rgba(255, 255, 255, 0.08);
      --danger: #ff4d4d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% -20%, #1c1c24 0%, #0d0d0f 100%);
      padding-bottom: 40px;
    }

    .container { padding: 20px; max-width: 500px; margin: 0 auto; }

    /* --- Header Estilo Profissional --- */
    .header-box {
      background: linear-gradient(145deg, #1e1e22, #141417);
      border: 1px solid var(--border-light);
      border-radius: 28px;
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 30px;
      box-shadow: 10px 10px 20px rgba(0,0,0,0.4), -5px -5px 15px rgba(255,255,255,0.02);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .header-box:active { transform: scale(0.96); }
    .header-box img { width: 65px; height: auto; filter: drop-shadow(0 0 10px var(--accent-glow)); }
    .header-box h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1.5px;
      background: linear-gradient(to bottom, #fff 40%, #a0a0a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* --- Conteúdo --- */
    .welcome { margin-bottom: 25px; }
    .welcome h2 { font-size: 26px; font-weight: 600; margin-bottom: 4px; }
    .welcome p { color: var(--text-muted); font-size: 16px; }

    .label-section {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .neu-card {
      background: linear-gradient(145deg, #1c1c21, #16161a);
      border-radius: 28px;
      border: 1px solid var(--border-light);
      padding: 24px;
      box-shadow: 15px 15px 30px rgba(0,0,0,0.5), -5px -5px 15px rgba(255,255,255,0.02);
      margin-bottom: 20px;
    }

    input {
      width: 100%; background: #131317; border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px; padding: 18px; color: #fff; font-size: 16px; margin-bottom: 18px;
      box-shadow: inset 4px 4px 8px rgba(0,0,0,0.5); outline: none;
      transition: border 0.3s;
    }

    #preview {
      height: 180px; background: #000; border-radius: 18px; margin-bottom: 18px;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.03);
    }
    #preview img { width: 100%; height: 100%; object-fit: cover; }
    .preview-msg { color: #444; font-size: 12px; font-weight: 700; text-transform: uppercase; }

    .btn-save {
      width: 100%; padding: 20px; border-radius: 20px; border: none;
      background: linear-gradient(145deg, #25252b, #18181c);
      color: #fff; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;
      box-shadow: 8px 8px 20px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    /* --- Listagem --- */
    .link-row {
      display: flex; align-items: center; gap: 15px; padding: 18px;
      background: rgba(255,255,255,0.02); border-radius: 22px; margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .link-icon {
      width: 60px; height: 60px; border-radius: 16px; background: #111;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 2px 2px 5px #000; overflow: hidden; flex-shrink: 0;
    }
    .link-icon img { width: 100%; height: 100%; object-fit: cover; }
    .link-content { flex: 1; min-width: 0; }
    .link-content a { color: #fff; text-decoration: none; font-weight: 600; font-size: 16px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
    .link-content span { color: var(--text-muted); font-size: 12px; text-transform: uppercase; }

    .btn-del { color: var(--danger); background: none; border: none; padding: 10px; font-size: 18px; cursor: pointer; }

    /* --- Botão Gaveta (UX One-Hand) --- */
    .floating-action {
      position: fixed; bottom: 30px; right: 20px; padding: 15px 25px;
      background: rgba(28, 28, 34, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border-radius: 50px; border: 1px solid var(--border-light);
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100;
      color: #fff; font-weight: 700; text-transform: uppercase; font-size: 12px;
      cursor: pointer;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header/Home -->
    <div class="header-box" onclick="switchTab('add')">
      <img src="logo.png" alt="Logo">
      <h1>Gaveta Mental</h1>
    </div>

    <!-- ABA: CAPTURAR -->
    <main id="tab-add" class="tab-content active">
      <div class="welcome">
        <h2>Olá, Leko</h2>
        <p>Seu refúgio mental.</p>
      </div>
      <div class="label-section">Nova Referência</div>
      <div class="neu-card">
        <input id="linkUrl" type="url" placeholder="Cole o link aqui..." autocomplete="off">
        <div id="preview"><span class="preview-msg">Aguardando Link...</span></div>
        <input id="linkTitle" type="text" placeholder="Identificação">
        <button id="btnSave" class="btn-save">Guardar na Memória</button>
      </div>
    </main>

    <!-- ABA: GAVETA -->
    <main id="tab-read" class="tab-content">
      <div class="welcome">
        <h2>Sua Gaveta</h2>
        <p>Explorando a mente.</p>
      </div>
      <div class="label-section">Memórias Guardadas</div>
      <div id="linksContainer"></div>
    </main>
  </div>

  <div id="floatBtn" class="floating-action" onclick="toggleGaveta()">
    <span id="floatText">Gaveta</span>
    <svg id="floatIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBu3V0-9jpnyliY0aszNkVgSp-xway4UnQ",
      authDomain: "gaveta-mental.firebaseapp.com",
      projectId: "gaveta-mental",
      storageBucket: "gaveta-mental.firebasestorage.app",
      messagingSenderId: "316564269533",
      appId: "1:316564269533:web:e8c54e87ce803ace8aae34"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentTab = 'add';
    window.switchTab = (tabId) => {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      currentTab = tabId;
      const fText = document.getElementById('floatText');
      fText.textContent = tabId === 'read' ? "Voltar" : "Gaveta";
    };

    window.toggleGaveta = () => currentTab === 'add' ? switchTab('read') : switchTab('add');

    const urlInput = document.getElementById('linkUrl');
    const titleInput = document.getElementById('linkTitle');
    const preview = document.getElementById('preview');
    let thumbUrl = "";

    urlInput.addEventListener('input', async () => {
      const url = urlInput.value.trim();
      if(url.includes('youtube.com') || url.includes('youtu.be')) {
        const id = url.includes('v=') ? url.split('v=')[1].split('&')[0] : url.split('/').pop().split('?')[0];
        thumbUrl = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
        preview.innerHTML = `<img src="${thumbUrl}">`;
        try {
          const res = await fetch(`https://noembed.com/embed?url=${url}`);
          const data = await res.json();
          if(data.title) titleInput.value = data.title;
        } catch(e) {}
      }
    });

    document.getElementById('btnSave').onclick = async () => {
      if(!urlInput.value) return;
      await addDoc(collection(db, "links"), {
        url: urlInput.value, title: titleInput.value || "Sem título",
        thumb: thumbUrl, createdAt: serverTimestamp()
      });
      urlInput.value = ""; titleInput.value = ""; thumbUrl = "";
      preview.innerHTML = '<span class="preview-msg">Guardado!</span>';
      setTimeout(() => switchTab('read'), 600);
    };

    onSnapshot(query(collection(db, "links"), orderBy("createdAt", "desc")), (snap) => {
      const container = document.getElementById('linksContainer');
      container.innerHTML = "";
      snap.forEach(d => {
        const item = d.data();
        const div = document.createElement('div');
        div.className = "link-row";
        div.innerHTML = `
          <div class="link-icon">${item.thumb ? `<img src="${item.thumb}">` : '❖'}</div>
          <div class="link-content">
            <a href="${item.url}" target="_blank">${item.title}</a>
            <span>Guardada</span>
          </div>
          <button class="btn-del" onclick="window.delLink('${d.id}')">✕</button>
        `;
        container.appendChild(div);
      });
    });

    window.delLink = async (id) => { if(confirm("Apagar?")) await deleteDoc(doc(db, "links", id)); };
  </script>
</body>
</html>
